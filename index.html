<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming soon</title>
<style>
  :root{
    --paper:#f6f8f7;
    --paper-raised:#ffffff;
    --ink:#20302d;
    --body:#333f3c;
    --muted:#67726d;
    --accent:#2f6f62;
    --line:#dbe3df;
    --tbc-bg:#fbf1dd;
    --tbc-line:#e4c684;
    --tbc-ink:#7a5a17;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--body);
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;line-height:1.6;
    padding:24px;-webkit-font-smoothing:antialiased;
  }
  main{
    max-width:480px;width:100%;
    background:var(--paper-raised);
    border-top:3px solid var(--accent);
    border-radius:4px;
    padding:40px 34px;
    text-align:center;
  }
  h1{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-weight:600;font-size:26px;line-height:1.3;
    color:var(--ink);margin:0 0 14px;
  }
  p{margin:0 0 10px;}
  .note{color:var(--muted);font-size:15.5px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .tbc{
    background:var(--tbc-bg);border:1px solid var(--tbc-line);border-radius:4px;
    padding:1px 7px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;color:var(--tbc-ink);
  }
</style>
</head>
<body>
<main>
  <h1>Your new website is on its way</h1>
  <p>This address is connected and working. The site itself is being built now — check back here as we go, and it'll update as pages go live.</p>
  <p class="note">A site for <span class="tbc">Jennifer Van Haazel (JM Cook)</span>, currently in progress.</p>
</main>
</body>
</html>
